name: Android · Build and release

# Once the version is incremented, a successful main build publishes a signed
# GitHub Release automatically. Obtainium monitors those APK assets.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: stickit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 35
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build developer APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate GIF encoding (JVM unit tests)
        run: gradle :gif-core:test --stacktrace
      - name: Upload developer APK (not for Obtainium)
        uses: actions/upload-artifact@v4
        with:
          name: stickit-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Prepare permanent signing key
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.STICKIT_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE" || { echo "::error::Missing GitHub secret STICKIT_SIGNING_BUNDLE"; exit 1; }
          PASS="${SIGNING_BUNDLE%%:*}"
          ENCODED="${SIGNING_BUNDLE#*:}"
          test -n "$PASS" && test -n "$ENCODED" && test "$PASS" != "$ENCODED" || { echo "::error::Invalid signing bundle"; exit 1; }
          echo "::add-mask::$PASS"
          printf '%s' "$ENCODED" | base64 -d > "$RUNNER_TEMP/stickit-release.p12"
          chmod 600 "$RUNNER_TEMP/stickit-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/stickit-release.p12" -storetype PKCS12 -storepass "$PASS" -alias stickit >/dev/null
          echo "STICKIT_KEYSTORE_PATH=$RUNNER_TEMP/stickit-release.p12" >> "$GITHUB_ENV"
          echo "STICKIT_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "STICKIT_KEY_ALIAS=stickit" >> "$GITHUB_ENV"
          echo "STICKIT_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Build permanent signed APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK signature
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Report signed APK size
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BYTES="$(stat -c %s "$APK")"
          MIB="$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          echo "Signed ARM64 release APK: $MIB MiB ($BYTES bytes)"
          echo "### Stickit release size" >> "$GITHUB_STEP_SUMMARY"
          echo "$MIB MiB ($BYTES bytes), ARM64-only, R8 optimized" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub Release for Obtainium
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION" || { echo "::error::Missing versionName"; exit 1; }
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$TAG" = "$GITHUB_REF_NAME" || { echo "::error::Tag must equal $TAG"; exit 1; }
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Nothing to publish."
            exit 0
          fi
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "stickit-$TAG.apk"
          gh release create "$TAG" "stickit-$TAG.apk" --target "$GITHUB_SHA" --title "Stickit $TAG" --generate-notes
